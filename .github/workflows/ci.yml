name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:types
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run test:browser
  # Firefox and WebKit: they start WebGL2 only where they find a GPU or a software GL, and the Linux runner gives them neither
  engines:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright-core install firefox webkit
      - run: npm run test:engines
