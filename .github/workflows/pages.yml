# The examples on GitHub Pages: the built player, example/, the featured characters. Needs Pages turned on for the
# repository with "GitHub Actions" as its source (Settings → Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Put the site together
        run: |
          mkdir _site
          cp -r dist example characters media _site/
          cp example/pages-index.html _site/index.html
          touch _site/.nojekyll
          # the face model's files, served with the pages: the camera demo then needs neither jsDelivr nor Google's bucket
          # (some networks reach neither). The checksum is of the model the player was tested with
          mkdir -p _site/mediapipe/wasm
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs _site/mediapipe/
          cp node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_internal.* node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_nosimd_internal.* _site/mediapipe/wasm/
          curl -fsSL --retry 3 -o _site/mediapipe/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          echo "64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  _site/mediapipe/face_landmarker.task" | sha256sum -c -
          sed -i 's#https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@[^/]*/vision_bundle.mjs#../mediapipe/vision_bundle.mjs#' _site/example/demo.html _site/example/png.html _site/example/vrm.html
          grep -q '"../mediapipe/vision_bundle.mjs"' _site/example/demo.html
          # three.js and three-vrm too, for the VRM page, so opening a .vrm online does not depend on a CDN either
          mkdir -p _site/vendor/three/build _site/vendor/three/examples/jsm/loaders _site/vendor/three/examples/jsm/utils _site/vendor/three-vrm
          cp node_modules/three/build/three.module.js node_modules/three/build/three.core.js _site/vendor/three/build/
          cp node_modules/three/examples/jsm/loaders/GLTFLoader.js _site/vendor/three/examples/jsm/loaders/
          cp node_modules/three/examples/jsm/utils/*.js _site/vendor/three/examples/jsm/utils/
          cp node_modules/@pixiv/three-vrm/lib/three-vrm.module.min.js _site/vendor/three-vrm/
          sed -i -e 's#https://cdn.jsdelivr.net/npm/three@[^/]*/build/three.module.js#../vendor/three/build/three.module.js#' -e 's#https://cdn.jsdelivr.net/npm/three@[^/]*/examples/jsm/#../vendor/three/examples/jsm/#' -e 's#https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@[^/]*/lib/three-vrm.module.min.js#../vendor/three-vrm/three-vrm.module.min.js#' _site/example/vrm.html
          grep -q '"../vendor/three/build/three.module.js"' _site/example/vrm.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
