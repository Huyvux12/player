<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LivLiv Player: a VRM</title>
<!-- where the browser finds three.js, three-vrm (and, for the camera, MediaPipe) without a bundler -->
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js",
  "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs"
} }</script>
<style>
  html, body { margin: 0; height: 100%; background: #20222b; color: #eef; font: 14px system-ui, sans-serif }
  canvas { display: block; width: 100%; height: 100% }
  .bar { position: fixed; z-index: 1; left: 12px; right: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px }
  button, label { font: inherit; padding: 6px 11px; border: 0; border-radius: 8px; background: #ffffff1c; color: inherit; cursor: pointer }
  button[aria-pressed="true"] { background: #ff4d5e }
  #status { position: fixed; z-index: 1; left: 12px; bottom: 12px; margin: 0; opacity: .8 }
</style>
<canvas id="stage"></canvas>
<div class="bar" id="bar">
  <label>open a .vrm… <input id="pick" type="file" accept=".vrm" hidden></label>
  <button id="mic">microphone</button>
  <button id="cam">camera</button>
</div>
<p id="status" role="status">Open a .vrm (VRoid Studio exports them), or add ?model=&lt;URL of a .vrm&gt;</p>
<script type="module">
  import { BodyPlayer } from '../dist/body.js'
  import { VrmBody } from '../dist/vrm.js'

  const player = new BodyPlayer(document.getElementById('stage'), new VrmBody())
  const status = document.getElementById('status'), bar = document.getElementById('bar')
  window.player = player

  async function show(source) {
    status.textContent = 'Loading…'
    try {
      const m = await player.load(source)
      status.textContent = `${m.name} · ${m.format}`
      bar.querySelectorAll('.x').forEach((b) => b.remove())
      for (const x of [{ id: null, label: 'neutral' }, ...m.expressions]) {
        const b = document.createElement('button'); b.className = 'x'; b.textContent = x.label
        b.onclick = () => player.setExpression(x.id); bar.append(b)
      }
      for (const a of ['nod', 'shake', 'tilt']) {
        const b = document.createElement('button'); b.className = 'x'; b.textContent = a; b.onclick = () => player.act(a); bar.append(b)
      }
    } catch (e) { status.textContent = e.message }
  }
  document.getElementById('pick').onchange = (e) => e.target.files.length && show(e.target.files[0])
  const url = new URLSearchParams(location.search).get('model')
  if (url) show(url)

  let mic = null, cam = null
  document.getElementById('mic').onclick = async (e) => {
    if (mic) { mic.stop(); mic = null } else {
      const { startLipSync } = await import('../dist/voice.js')
      mic = await startLipSync(player).catch((err) => { status.textContent = err.message; return null })
    }
    e.target.setAttribute('aria-pressed', String(!!mic))
  }
  document.getElementById('cam').onclick = async (e) => {
    if (cam) { cam.stop(); cam = null } else {
      const { startFaceTracking } = await import('../dist/tracking.js')
      cam = await startFaceTracking(player).catch((err) => { status.textContent = err.message; return null })
    }
    e.target.setAttribute('aria-pressed', String(!!cam))
  }
</script>
</html>
